# NAS / LAN stack (binds 0.0.0.0 so http://<nas-ip>:3000 works).
# From this directory on the NAS:
#   docker compose -f docker-compose.nas.yml --env-file .env up -d --build
#
# Config: copy .env.example → .env and fill secrets (API_KEY, DeepSeek, NAS SSH, …).

name: openterminal

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "${API_PUBLISH_PORT:-4000}:4000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-}
      - API_KEY=${API_KEY:-}
      - API_HOST=0.0.0.0
      - WEB_ORIGIN=${WEB_ORIGIN:-http://192.168.50.147:3000}
      - DATA_DIR=/app/data
      - TRUST_PROXY=${TRUST_PROXY:-}
    volumes:
      - terminal-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "${WEB_PUBLISH_PORT:-3000}:3000"
    environment:
      - API_URL=http://api:4000
      - API_KEY=${API_KEY:-}
      - API_KEY_FILE=/app/data/.api-key
    volumes:
      - terminal-data:/app/data:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  terminal-data:
